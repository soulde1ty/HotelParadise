{% load i18n %}
<div class="container py-4">
    <form method="get" action="{% url 'room' %}" class="bg-white shadow p-4">
        <h2 class="h4">{% translate "Find a room" %}</h2>
        {% if search_form.non_field_errors %}<div class="alert alert-danger" role="alert">{{ search_form.non_field_errors }}</div>{% endif %}
        <div class="row g-3 align-items-end">
            {% for field in search_form %}
            <div class="col-md-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<div class="text-danger" role="alert">{{ error }}</div>{% endfor %}
            </div>
            {% endfor %}
            <div class="col-12">
                <button class="btn btn-primary" type="submit">{% translate "Search rooms" %}</button>
                <a class="btn btn-outline-secondary" href="{% url 'room' %}">{% translate "Reset" %}</a>
            </div>
        </div>
    </form>
</div>
