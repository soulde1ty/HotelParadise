{% load i18n %}
{% if form.non_field_errors %}
<div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
<div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<small class="text-muted">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<div class="text-danger" role="alert">{{ error }}</div>{% endfor %}
</div>
{% endfor %}
