{% load i18n %}
{% load static %}

<div class="container-fluid p-0 mb-5">
    <div id="header-carousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img class="w-100" src="{% static 'img/carousel-1.jpg' %}" alt="{% translate 'Image' %}">
                <div class="carousel-caption d-flex flex-column align-items-center justify-content-center">
                    <div class="p-3" style="max-width: 700px;">
                        <h6 class="section-title text-white text-uppercase mb-3 animated slideInDown">{% translate "Luxury Living" %}</h6>
                        <h1 class="display-3 text-white mb-4 animated slideInDown">{% translate "Discover A Brand Luxurious Hotel" %}</h1>
                        <a href="{% url 'room' %}" class="btn btn-primary py-md-3 px-md-5 me-3 animated slideInLeft">{% translate "Our Rooms" %}</a>
                    </div>
                </div>
            </div>
            <div class="carousel-item">
                <img class="w-100" src="{% static 'img/carousel-2.jpg' %}" alt="{% translate 'Image' %}">
                <div class="carousel-caption d-flex flex-column align-items-center justify-content-center">
                    <div class="p-3" style="max-width: 700px;">
                        <h6 class="section-title text-white text-uppercase mb-3 animated slideInDown">{% translate "Luxury Living" %}</h6>
                        <h1 class="display-3 text-white mb-4 animated slideInDown">{% translate "Discover A Brand Luxurious Hotel" %}</h1>
                        <a href="{% url 'room' %}" class="btn btn-primary py-md-3 px-md-5 me-3 animated slideInLeft">{% translate "Our Rooms" %}</a>
                        <a href="{% url 'room' %}" class="btn btn-light py-md-3 px-md-5 animated slideInRight">{% translate "Book A Room" %}</a>
                    </div>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#header-carousel"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">{% translate "Previous" %}</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#header-carousel"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">{% translate "Next" %}</span>
        </button>
    </div>
</div>
